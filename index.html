<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finance">
<title>Finance Tracker</title>
<style>
  :root {
    --green: #1D9E75;
    --green-bg: #E1F5EE;
    --red: #E24B4A;
    --red-bg: #FCEBEB;
    --text: #1a1a1a;
    --text-2: #666;
    --text-3: #999;
    --bg: #f5f5f0;
    --card: #ffffff;
    --border: rgba(0,0,0,0.1);
    --radius: 14px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #f0f0ec;
      --text-2: #aaa;
      --text-3: #666;
      --bg: #0f0f0e;
      --card: #1c1c1a;
      --border: rgba(255,255,255,0.1);
      --green-bg: #0a2a1e;
      --red-bg: #2a0d0d;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: calc(var(--safe-bottom) + 70px);
  }

  /* Header */
  .header {
    background: var(--card);
    padding: 16px 20px 14px;
    border-bottom: 0.5px solid var(--border);
    position: sticky;
    top: var(--safe-top);
    z-index: 10;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .header-title { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  .month-pick { font-size: 14px; color: var(--green); font-weight: 500; border: none; background: none; cursor: pointer; padding: 0; }

  /* Balance bar */
  .balance-bar { display: grid; grid-template-columns: 1fr 0.5px 1fr 0.5px 1fr; gap: 0; }
  .balance-bar .divider { background: var(--border); }
  .bal-item { text-align: center; padding: 2px 0; }
  .bal-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
  .bal-val { font-size: 16px; font-weight: 600; letter-spacing: -0.5px; }
  .bal-val.inc { color: var(--green); }
  .bal-val.exp { color: var(--red); }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: var(--card);
    border-top: 0.5px solid var(--border);
    display: flex;
    padding-bottom: var(--safe-bottom);
    z-index: 20;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 0 8px;
    border: none;
    background: none;
    cursor: pointer;
    gap: 3px;
    color: var(--text-3);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .02em;
  }
  .nav-btn svg { width: 22px; height: 22px; stroke-width: 1.7; }
  .nav-btn.active { color: var(--green); }

  /* Sections */
  .section { display: none; padding: 0 16px 16px; }
  .section.active { display: block; }

  /* Cards */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 12px;
    border: 0.5px solid var(--border);
  }

  /* Type toggle */
  .type-toggle { display: flex; gap: 8px; margin-top: 12px; }
  .type-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: none;
    color: var(--text-2);
    transition: all .15s;
  }
  .type-btn.inc.active { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .type-btn.exp.active { background: var(--red-bg); color: var(--red); border-color: var(--red); }

  /* Form */
  .form-group { margin-top: 14px; }
  .form-label { font-size: 12px; color: var(--text-3); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; display: block; }
  .form-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 0.5px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    -webkit-appearance: none;
  }
  .form-input:focus { outline: none; border-color: var(--green); }
  .amount-input { font-size: 28px; font-weight: 600; letter-spacing: -1px; text-align: center; }

  /* Grid form */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Submit btn */
  .submit-btn {
    width: 100%;
    margin-top: 18px;
    padding: 15px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: -0.2px;
    transition: opacity .15s, transform .1s;
  }
  .submit-btn:active { transform: scale(0.98); opacity: 0.85; }
  .submit-btn.inc { background: var(--green); color: white; }
  .submit-btn.exp { background: var(--red); color: white; }

  /* Loading / toast */
  .toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 78px);
    left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: opacity .2s;
    z-index: 100;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* Entry list */
  .entry-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .entry-item:last-child { border-bottom: none; }
  .entry-icon {
    width: 38px; height: 38px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .entry-icon.inc { background: var(--green-bg); }
  .entry-icon.exp { background: var(--red-bg); }
  .entry-info { flex: 1; min-width: 0; }
  .entry-cat { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .entry-sub { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .entry-right { text-align: right; flex-shrink: 0; }
  .entry-amt { font-size: 15px; font-weight: 600; }
  .entry-amt.inc { color: var(--green); }
  .entry-amt.exp { color: var(--red); }
  .entry-date { font-size: 11px; color: var(--text-3); margin-top: 2px; }

  /* Delete swipe button */
  .del-btn {
    background: var(--red-bg);
    border: none;
    color: var(--red);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    flex-shrink: 0;
  }

  /* Section header */
  .section-hdr { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 0; }
  .section-hdr-label { font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: uppercase; letter-spacing: .05em; }

  /* Summary */
  .sum-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .sum-card { background: var(--card); border-radius: 12px; padding: 14px; border: 0.5px solid var(--border); }
  .sum-card-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .sum-card-val { font-size: 20px; font-weight: 700; letter-spacing: -0.8px; }

  /* Cat breakdown */
  .cat-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
  .cat-row:last-child { border-bottom: none; }
  .cat-bar-wrap { flex: 1; }
  .cat-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
  .cat-bar-bg { height: 5px; background: var(--border); border-radius: 3px; }
  .cat-bar-fill { height: 5px; background: var(--red); border-radius: 3px; transition: width .4s; }
  .cat-amt { font-size: 14px; font-weight: 600; color: var(--red); flex-shrink: 0; min-width: 70px; text-align: right; }

  .empty { text-align: center; color: var(--text-3); font-size: 15px; padding: 40px 0; }

  /* Config section */
  .config-input-wrap { display: flex; gap: 8px; }
  .config-input-wrap .form-input { flex: 1; font-size: 13px; font-family: 'SF Mono', monospace; }
  .save-btn {
    padding: 12px 16px; border-radius: 10px; border: none;
    background: var(--green); color: white;
    font-size: 14px; font-weight: 600; cursor: pointer;
    white-space: nowrap;
  }
  .config-note { font-size: 12px; color: var(--text-3); margin-top: 8px; line-height: 1.5; }
  .config-note a { color: var(--green); }

  /* Export btn */
  .export-btn {
    width: 100%;
    margin-top: 14px;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: none;
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-top">
    <div class="header-title">💰 Finance Tracker</div>
    <select class="month-pick" id="monthPick" onchange="onMonthChange()"></select>
  </div>
  <div class="balance-bar">
    <div class="bal-item">
      <div class="bal-label">Income</div>
      <div class="bal-val inc" id="hIncome">฿0</div>
    </div>
    <div class="divider"></div>
    <div class="bal-item">
      <div class="bal-label">Balance</div>
      <div class="bal-val" id="hBalance">฿0</div>
    </div>
    <div class="divider"></div>
    <div class="bal-item">
      <div class="bal-label">Expense</div>
      <div class="bal-val exp" id="hExpense">฿0</div>
    </div>
  </div>
</div>

<!-- Sections -->
<div class="section active" id="sec-add">
  <div class="type-toggle">
    <button class="type-btn inc active" id="btn-inc" onclick="setType('income')">＋ Income</button>
    <button class="type-btn exp" id="btn-exp" onclick="setType('expense')">－ Expense</button>
  </div>
  <div class="card">
    <label class="form-label">Amount (฿)</label>
    <input class="form-input amount-input" type="number" inputmode="decimal" id="fAmount" placeholder="0">

    <div class="form-grid" style="margin-top:14px">
      <div class="form-group">
        <label class="form-label">Date</label>
        <input class="form-input" type="date" id="fDate">
      </div>
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="form-input" id="fCat"></select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Note</label>
      <input class="form-input" type="text" id="fNote" placeholder="Optional">
    </div>

    <button class="submit-btn inc" id="submitBtn" onclick="submitEntry()">Add Income</button>
  </div>
</div>

<div class="section" id="sec-entries">
  <div class="section-hdr">
    <span class="section-hdr-label">Entries</span>
    <select class="month-pick" id="eFilt" onchange="renderEntries()" style="font-size:13px"></select>
  </div>
  <div class="card" id="entriesCard">
    <div class="empty">Loading…</div>
  </div>
</div>

<div class="section" id="sec-summary">
  <div class="sum-grid" id="sumGrid"></div>
  <div class="section-hdr" style="margin-top:16px">
    <span class="section-hdr-label">By category</span>
  </div>
  <div class="card" id="catCard"></div>
  <button class="export-btn" onclick="exportCSV()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" width="18" height="18"><path d="M12 16L7 11M12 16L17 11M12 16V4M6 20H18" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Export CSV
  </button>
</div>

<div class="section" id="sec-config">
  <div class="card">
    <label class="form-label">Apps Script Web App URL</label>
    <div class="config-input-wrap">
      <input class="form-input" type="url" id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec">
      <button class="save-btn" onclick="saveConfig()">Save</button>
    </div>
    <p class="config-note">
      1. Open your Google Sheet → <b>Extensions → Apps Script</b><br>
      2. Paste the <code>Code.gs</code> script<br>
      3. <b>Deploy → New deployment → Web App</b><br>
      &nbsp;&nbsp;&nbsp;Execute as: <b>Me</b> | Access: <b>Anyone</b><br>
      4. Copy the <b>/exec</b> URL and paste above
    </p>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-add" onclick="switchTab('add')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
    Add
  </button>
  <button class="nav-btn" id="nav-entries" onclick="switchTab('entries')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke-linecap="round"/></svg>
    Entries
  </button>
  <button class="nav-btn" id="nav-summary" onclick="switchTab('summary')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round"/></svg>
    Summary
  </button>
  <button class="nav-btn" id="nav-config" onclick="switchTab('config')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke-linecap="round"/></svg>
    Setup
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS = {
  income: ['Salary','Freelance','Investment','Business','Other'],
  expense: ['Food','Transport','Medical','Shopping','Utilities','Entertainment','Other']
};

let currentType = 'income';
let allEntries = [];
let apiUrl = localStorage.getItem('fin_api_url') || '';
let currentMonth = '';

// Init
document.getElementById('fDate').value = todayStr();
document.getElementById('apiUrl').value = apiUrl;
populateCats();
buildMonthPickers();
if (apiUrl) loadEntries();

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function fmt(n) {
  return '฿' + Math.abs(n).toLocaleString('th-TH', { maximumFractionDigits: 0 });
}

function setType(t) {
  currentType = t;
  document.getElementById('btn-inc').classList.toggle('active', t === 'income');
  document.getElementById('btn-exp').classList.toggle('active', t === 'expense');
  const btn = document.getElementById('submitBtn');
  btn.className = 'submit-btn ' + (t === 'income' ? 'inc' : 'exp');
  btn.textContent = t === 'income' ? 'Add Income' : 'Add Expense';
  populateCats();
}

function populateCats() {
  const sel = document.getElementById('fCat');
  sel.innerHTML = CATS[currentType].map(c => `<option>${c}</option>`).join('');
}

function showToast(msg, dur = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function saveConfig() {
  const url = document.getElementById('apiUrl').value.trim();
  localStorage.setItem('fin_api_url', url);
  apiUrl = url;
  showToast('✅ Saved! Loading data…');
  loadEntries();
}

async function apiCall(method, body) {
  if (!apiUrl) { showToast('⚠️ Set your API URL in Setup first'); return null; }
  try {
    const opts = method === 'GET'
      ? { method: 'GET' }
      : { method: 'POST', body: JSON.stringify(body) };
    const url = method === 'GET' ? apiUrl + '?action=getAll' : apiUrl;
    const res = await fetch(url, opts);
    return await res.json();
  } catch (e) {
    showToast('❌ Network error');
    return null;
  }
}

async function loadEntries() {
  const data = await apiCall('GET');
  if (!data || !data.ok) return;
  allEntries = (data.data || []).filter(e => e.ID);
  buildMonthPickers();
  updateHeader();
  renderEntries();
  renderSummary();
}

async function submitEntry() {
  const amt = parseFloat(document.getElementById('fAmount').value);
  if (!amt || amt <= 0) { showToast('Enter a valid amount'); return; }

  const entry = {
    action: 'add',
    date: document.getElementById('fDate').value || todayStr(),
    type: currentType,
    category: document.getElementById('fCat').value,
    amount: amt,
    note: document.getElementById('fNote').value.trim()
  };

  showToast('Saving…', 10000);
  const res = await apiCall('POST', entry);
  if (res && res.ok) {
    entry.ID = res.id;
    entry.Amount = amt;
    entry.Date = entry.date;
    entry.Type = entry.type;
    entry.Category = entry.category;
    entry.Note = entry.note;
    allEntries.unshift(entry);
    document.getElementById('fAmount').value = '';
    document.getElementById('fNote').value = '';
    buildMonthPickers();
    updateHeader();
    renderEntries();
    renderSummary();
    showToast('✅ Added!');
  }
}

async function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  showToast('Deleting…', 10000);
  const res = await apiCall('POST', { action: 'delete', id: String(id) });
  if (res && res.ok) {
    allEntries = allEntries.filter(e => String(e.ID) !== String(id));
    updateHeader();
    renderEntries();
    renderSummary();
    showToast('🗑 Deleted');
  }
}

function buildMonthPickers() {
  const months = [...new Set(allEntries.map(e => (e.Date || e.date || '').slice(0, 7)))].filter(Boolean).sort().reverse();
  const allOpt = '<option value="">All months</option>';
  const opts = allOpt + months.map(m => `<option value="${m}">${m}</option>`).join('');
  ['monthPick', 'eFilt'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const v = el.value;
    el.innerHTML = opts;
    if (months.includes(v)) el.value = v;
  });
  if (!currentMonth && months.length) {
    currentMonth = months[0];
    document.getElementById('monthPick').value = currentMonth;
    document.getElementById('eFilt').value = currentMonth;
  }
}

function filteredEntries(month) {
  const m = month || document.getElementById('monthPick').value;
  return m ? allEntries.filter(e => (e.Date || e.date || '').startsWith(m)) : allEntries;
}

function onMonthChange() {
  currentMonth = document.getElementById('monthPick').value;
  document.getElementById('eFilt').value = currentMonth;
  updateHeader();
  renderEntries();
  renderSummary();
}

function updateHeader() {
  const entries = filteredEntries(document.getElementById('monthPick').value);
  const inc = entries.filter(e => (e.Type || e.type) === 'income').reduce((a, e) => a + Number(e.Amount || e.amount || 0), 0);
  const exp = entries.filter(e => (e.Type || e.type) === 'expense').reduce((a, e) => a + Number(e.Amount || e.amount || 0), 0);
  const bal = inc - exp;
  document.getElementById('hIncome').textContent = fmt(inc);
  document.getElementById('hExpense').textContent = fmt(exp);
  const bEl = document.getElementById('hBalance');
  bEl.textContent = (bal < 0 ? '-' : '') + fmt(bal);
  bEl.style.color = bal < 0 ? 'var(--red)' : bal > 0 ? 'var(--green)' : '';
}

function renderEntries() {
  const m = document.getElementById('eFilt').value;
  const list = filteredEntries(m);
  const card = document.getElementById('entriesCard');
  if (!list.length) { card.innerHTML = '<div class="empty">No entries</div>'; return; }

  const catIcons = { Salary:'💼', Freelance:'💻', Investment:'📈', Business:'🏢', Food:'🍜', Transport:'🚗', Medical:'🏥', Shopping:'🛍', Utilities:'💡', Entertainment:'🎬', Other:'📌' };

  card.innerHTML = list.map(e => {
    const t = e.Type || e.type;
    const cat = e.Category || e.category;
    const note = e.Note || e.note;
    const amt = Number(e.Amount || e.amount || 0);
    const date = e.Date || e.date;
    const id = e.ID || e.id;
    const icon = catIcons[cat] || '💰';
    return `
      <div class="entry-item">
        <div class="entry-icon ${t === 'income' ? 'inc' : 'exp'}">${icon}</div>
        <div class="entry-info">
          <div class="entry-cat">${cat}${note ? ' · ' + note : ''}</div>
          <div class="entry-sub">${date}</div>
        </div>
        <div class="entry-right">
          <div class="entry-amt ${t === 'income' ? 'inc' : 'exp'}">${t === 'income' ? '+' : '-'}${fmt(amt)}</div>
        </div>
        <button class="del-btn" onclick="deleteEntry('${id}')">Del</button>
      </div>`;
  }).join('');
}

function renderSummary() {
  const entries = filteredEntries(document.getElementById('monthPick').value);
  const inc = entries.filter(e => (e.Type || e.type) === 'income').reduce((a, e) => a + Number(e.Amount || e.amount || 0), 0);
  const exp = entries.filter(e => (e.Type || e.type) === 'expense').reduce((a, e) => a + Number(e.Amount || e.amount || 0), 0);
  const bal = inc - exp;

  document.getElementById('sumGrid').innerHTML = `
    <div class="sum-card"><div class="sum-card-label">Income</div><div class="sum-card-val" style="color:var(--green)">${fmt(inc)}</div></div>
    <div class="sum-card"><div class="sum-card-label">Expense</div><div class="sum-card-val" style="color:var(--red)">${fmt(exp)}</div></div>
    <div class="sum-card"><div class="sum-card-label">Balance</div><div class="sum-card-val" style="color:${bal >= 0 ? 'var(--green)' : 'var(--red)'}">${bal < 0 ? '-' : ''}${fmt(bal)}</div></div>
    <div class="sum-card"><div class="sum-card-label">Entries</div><div class="sum-card-val">${entries.length}</div></div>`;

  // Category breakdown
  const expCats = {};
  entries.filter(e => (e.Type || e.type) === 'expense').forEach(e => {
    const c = e.Category || e.category;
    expCats[c] = (expCats[c] || 0) + Number(e.Amount || e.amount || 0);
  });
  const sorted = Object.entries(expCats).sort((a, b) => b[1] - a[1]);
  const maxVal = sorted[0]?.[1] || 1;
  const catCard = document.getElementById('catCard');
  if (!sorted.length) { catCard.innerHTML = '<div class="empty">No expense data</div>'; return; }
  catCard.innerHTML = sorted.map(([cat, val]) => `
    <div class="cat-row">
      <div class="cat-bar-wrap">
        <div class="cat-name">${cat}</div>
        <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${Math.round(val / maxVal * 100)}%"></div></div>
      </div>
      <div class="cat-amt">${fmt(val)}</div>
    </div>`).join('');
}

function exportCSV() {
  const entries = filteredEntries(document.getElementById('monthPick').value);
  if (!entries.length) { showToast('No data to export'); return; }
  const rows = [['Date', 'Type', 'Category', 'Note', 'Amount'],
    ...entries.map(e => [e.Date || e.date, e.Type || e.type, e.Category || e.category, e.Note || e.note, e.Amount || e.amount])];
  const csv = rows.map(r => r.map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
  a.download = 'finance.csv';
  a.click();
}

function switchTab(t) {
  ['add', 'entries', 'summary', 'config'].forEach(s => {
    document.getElementById('sec-' + s).classList.toggle('active', s === t);
    document.getElementById('nav-' + s).classList.toggle('active', s === t);
  });
  if (t === 'entries') renderEntries();
  if (t === 'summary') renderSummary();
}
</script>
</body>
</html>
